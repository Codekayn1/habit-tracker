<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Habit Tracker</h1>

    <form id="habit-form" class="add-form">
      <input id="habit-name" type="text" placeholder="Нова звичка, напр. «Пити воду»" maxlength="60" required>
      <button type="submit">Додати</button>
    </form>

    <p id="empty" class="empty">Поки що немає звичок. Додайте першу!</p>
    <ul id="habit-list" class="habit-list"></ul>

    <section id="stats" class="stats" hidden>
      <h2>Статистика за 14 днів</h2>
      <div class="chart-wrap"><canvas id="stats-chart"></canvas></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
